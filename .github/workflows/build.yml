name: Build EOS SDK Emulator

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# a newer push to the same branch cancels a still running build (keeps the dev-build release consistent)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-lan-win64-${{ github.sha }}
          path: build/Release/EOSSDK-Win64-Shipping.dll

      # every push to main replaces the "dev-build" pre-release on the Releases page
      - name: Publish dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path devdist | Out-Null
          Copy-Item build/Release/EOSSDK-Win64-Shipping.dll devdist/
          Compress-Archive -Path devdist/EOSSDK-Win64-Shipping.dll -DestinationPath eos-lan-win64-dev.zip -Force
          gh release view dev-build 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete dev-build --cleanup-tag --yes }
          $global:LASTEXITCODE = 0
          $date = Get-Date -AsUTC -Format "yyyy-MM-dd HH:mm 'UTC'"
          $msg = (git log -1 --format=%s).Trim()
          $notes = @"
          **Automatically built from the latest ``main`` branch. Not a stable release.**

          - Build date: $date
          - Commit: ${{ github.sha }}
          - Last change: $msg
          "@
          gh release create dev-build eos-lan-win64-dev.zip --prerelease --target "${{ github.sha }}" --title "Development build" --notes $notes

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/Release/EOSSDK-Win64-Shipping.dll dist/
          Compress-Archive -Path dist/EOSSDK-Win64-Shipping.dll -DestinationPath eos-lan-win64.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: EOS SDK LAN Emulator ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: eos-lan-win64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
